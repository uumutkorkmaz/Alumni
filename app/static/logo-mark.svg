<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Alumni Tracking">
  <title>Alumni Tracking</title>
  <!-- The gate and the cap (brand.md §3): an arched gateway with a mortarboard above it,
       in Midnight Ink on İÜ green, with a thin gold edge. An original mark, not the university's emblem. -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#439c86"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" fill="none" stroke="#b8860b" stroke-opacity=".55"/>
  <!-- gateway: two pillars and the arch, on a threshold -->
  <path d="M19.5 51 V42 a12.5 12.5 0 0 1 25 0 V51" fill="none" stroke="#0d1614" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14 52.5 H50" stroke="#0d1614" stroke-width="4" stroke-linecap="round"/>
  <!-- mortarboard: the board, its crown and the tassel -->
  <path d="M32 6 L50.5 13.5 L32 21 L13.5 13.5 Z" fill="#0d1614"/>
  <path d="M23.5 17.4 V21 c0 2.3 4 3.6 8.5 3.6 s8.5 -1.3 8.5 -3.6 V17.4 L32 21 Z" fill="#0d1614"/>
  <path d="M47.5 15 V22.5" stroke="#0d1614" stroke-width="2" stroke-linecap="round"/>
  <circle cx="47.5" cy="24" r="2.1" fill="#0d1614"/>
</svg>
