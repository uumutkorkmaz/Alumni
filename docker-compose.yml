name: alumni-fastapi

services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/code/app
      - ./migrations:/code/migrations
      - ./alembic.ini:/code/alembic.ini
      - ./logs:/code/logs
      # Registration documents (ddd.md 4.1.2): kept outside app/static, ignored by git.
      - ./uploads:/code/uploads
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Europe/Istanbul}
      DEBUG_ROUTES: ${DEBUG_ROUTES:-0}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-ogr.iu.edu.tr}
      STAFF_EMAIL_DOMAIN: ${STAFF_EMAIL_DOMAIN:-istanbul.edu.tr}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      DEV_LOGIN: ${DEV_LOGIN:-0}

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
